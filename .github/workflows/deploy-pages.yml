name: Comprobar y publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Marcar workflow iniciado
        run: |
          git tag -f pages-workflow-started "$GITHUB_SHA"
          git push --force origin refs/tags/pages-workflow-started

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Marcar Pages habilitado
        run: |
          git tag -f pages-configured "$GITHUB_SHA"
          git push --force origin refs/tags/pages-configured
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Marcar artefacto preparado
        run: |
          git tag -f pages-artifact "$GITHUB_SHA"
          git push --force origin refs/tags/pages-artifact
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Marcar despliegue confirmado
        run: |
          git tag -f pages-live "$GITHUB_SHA"
          git push --force origin refs/tags/pages-live
